<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --accent: __ACCENT__;
    --accent-soft: __ACCENT_SOFT__;
    --page: #f4f4f6;
    --ink: #16161d;
    --muted: #6b7280;
    --line: #e5e7eb;
    --chrome: #1e2939;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--page); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
    padding: 13px 20px; background: #fff; border-bottom: 1px solid var(--line);
  }
  header .title { font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
  header .sep { width: 1px; height: 18px; background: var(--line); }
  header .sub { color: var(--muted); font-size: 13px;
                overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  header .spacer { flex: 1; }
  header .count {
    font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap;
    font-variant-numeric: tabular-nums;
    padding: 4px 10px; border: 1px solid var(--line); border-radius: 999px;
  }
  .iconbtn {
    display: grid; place-items: center; width: 30px; height: 28px; flex-shrink: 0;
    border: 1px solid var(--line); border-radius: 7px; background: #fff;
    cursor: pointer; color: var(--muted);
  }
  .iconbtn:hover { background: #f9fafb; color: var(--ink); }

  #stage { flex: 1; position: relative; display: grid; place-items: center; padding: 24px; min-height: 0; }

  /* Browser shell. Framing the clone as a window is what stops it reading as
     "a screenshot in a box" — the same trick every demo tool uses. */
  #window {
    position: relative; border-radius: var(--radius); overflow: hidden;
    background: var(--chrome); border: 1px solid rgba(0,0,0,.12);
    box-shadow: 0 1px 2px rgba(16,24,40,.06), 0 18px 50px rgba(16,24,40,.18);
  }
  #chrome {
    height: 38px; display: flex; align-items: center; gap: 8px; padding: 0 12px;
    background: var(--chrome); flex-shrink: 0;
  }
  .light { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
  .light.r { background: #ff5f57; } .light.y { background: #febc2e; } .light.g { background: #28c840; }
  #addr {
    flex: 1; margin: 0 8px; height: 23px; border-radius: 999px;
    background: rgba(255,255,255,.10); color: rgba(255,255,255,.72);
    font-size: 11.5px; display: flex; align-items: center; justify-content: center;
    padding: 0 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* #fit carries the SCALED size so normal centring works; #scaler holds the
     page at 1:1 and shrinks from its top-left. Scaling a full-size box directly
     overflows the grid track, and an overflowing centred item snaps back to the
     start — which clipped the right edge. */
  #fit { position: relative; overflow: hidden; background: #fff; }
  #scaler { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  #mount { position: absolute; inset: 0; }
  #mount iframe {
    position: absolute; top: 0; left: 0; border: 0; display: block; background: #fff;
    transition: opacity .32s ease;
  }
  #overlay { position: absolute; inset: 0; pointer-events: none; }

  .hotspot {
    position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px;
    border-radius: 50%; background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-soft);
    cursor: pointer; pointer-events: auto;
    animation: dotIn .3s ease-out .3s both;
  }
  .hotspot::after {
    content: ''; position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid var(--accent);
    animation: halo 1.9s cubic-bezier(.2,.6,.35,1) infinite;
  }
  @keyframes dotIn { from { transform: scale(0); } to { transform: scale(1); } }
  @keyframes halo {
    0%   { transform: scale(.7); opacity: .85; }
    70%  { transform: scale(2.1); opacity: 0; }
    100% { transform: scale(2.1); opacity: 0; }
  }

  #cursor {
    position: absolute; left: 0; top: 0; width: 26px; height: 26px;
    margin: -4px 0 0 -3px; z-index: 5; pointer-events: none; opacity: 0;
    transition: transform .72s cubic-bezier(.33,.72,.29,1), opacity .3s ease;
    will-change: transform;
  }
  #cursor svg { display: block; filter: drop-shadow(0 2px 4px rgba(16,24,40,.35)); }
  #cursorRipple {
    position: absolute; left: 0; top: 0; width: 26px; height: 26px;
    margin: -13px 0 0 -13px; border-radius: 50%;
    border: 2px solid var(--accent); opacity: 0; z-index: 4; pointer-events: none;
  }
  #cursorRipple.go { animation: tap .55s ease-out; }
  @keyframes tap {
    0%   { transform: scale(.4); opacity: .9; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  /* The callout lives OUTSIDE the scaled frame, so its text stays crisp at any
     zoom level and floating-ui can position it in plain screen coordinates. */
  #callout {
    position: fixed; top: 0; left: 0; width: 268px; z-index: 40;
    background: var(--accent); color: #fff;
    border-radius: 10px; padding: 14px 16px 12px;
    box-shadow: 0 10px 34px rgba(16,24,40,.24);
    animation: cardIn .42s cubic-bezier(.2,.8,.3,1) .34s both;
  }
  #callout.hidden { display: none; }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
    to   { opacity: 1; transform: none; }
  }
  #arrow { position: absolute; width: 10px; height: 10px; background: var(--accent);
           transform: rotate(45deg); }
  #callout .text { font-size: 14px; font-weight: 650; line-height: 1.45; position: relative; }
  #callout .foot { display: flex; align-items: center; margin-top: 12px; position: relative; }
  #callout .of { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72);
                 font-variant-numeric: tabular-nums; }
  #callout .grow { flex: 1; }
  #callout button {
    width: 34px; height: 30px; border: 0; border-radius: 7px; cursor: pointer;
    background: rgba(255,255,255,.22); color: #fff; font-size: 15px; line-height: 1;
    display: grid; place-items: center;
  }
  #callout button:hover:not(:disabled) { background: rgba(255,255,255,.34); }
  #callout button:disabled { opacity: .35; cursor: default; }
  #callout .back { margin-right: 6px; }

  /* Cover: a title card so the demo opens deliberately instead of dropping the
     viewer into step one with no context. */
  #cover {
    position: absolute; inset: 0; z-index: 60; display: grid; place-items: center;
    background: rgba(244,244,246,.72); backdrop-filter: blur(9px);
    -webkit-backdrop-filter: blur(9px);
  }
  #cover.gone { display: none; }
  #cover .card { text-align: center; max-width: 520px; padding: 0 24px; }
  #cover h1 { font-size: 30px; line-height: 1.2; letter-spacing: -.02em; margin: 0 0 10px; }
  #cover p { color: var(--muted); font-size: 15px; margin: 0 0 26px; }
  #cover button {
    border: 0; border-radius: 9px; cursor: pointer; padding: 12px 26px;
    background: var(--accent); color: #fff; font: 650 15px/1 inherit;
    box-shadow: 0 8px 24px var(--accent-soft);
  }
  #cover button:hover { filter: brightness(1.08); }
  #cover .hint { margin-top: 18px; font-size: 12px; color: var(--muted); }

  footer {
    display: flex; align-items: center; gap: 12px; flex-shrink: 0;
    padding: 10px 20px; background: #fff; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--muted);
  }
  footer .dots { display: flex; gap: 6px; flex-wrap: wrap; }
  footer .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--line);
    cursor: pointer; transition: background .2s, transform .2s;
  }
  footer .dot.on { background: var(--accent); transform: scale(1.25); }
  footer .grow { flex: 1; }

  @media (max-width: 720px) {
    header .sub, footer .dots { display: none; }
    #stage { padding: 10px; }
  }
</style>
</head>
<body>
<header>
  <span class="title">__TITLE__</span>
  <span class="sep"></span>
  <span class="sub" id="caption"></span>
  <span class="spacer"></span>
  <span class="count"><span id="cur">1</span> / <span id="total">1</span></span>
  <button class="iconbtn" id="fs" title="Fullscreen" aria-label="Fullscreen">⛶</button>
</header>

<div id="stage">
  <div id="window">
    <div id="chrome">
      <span class="light r"></span><span class="light y"></span><span class="light g"></span>
      <span id="addr"></span>
    </div>
    <div id="fit">
      <div id="scaler">
        <!-- rrweb creates the iframe per step so it owns the sandbox attribute
             (allow-same-origin, no allow-scripts). -->
        <div id="mount"></div>
        <div id="overlay"></div>
        <div id="cursorRipple"></div>
        <div id="cursor">
          <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
            <path d="M4 2.5 L4 20 L8.7 15.6 L11.6 22.4 L14.9 21 L12 14.4 L18.4 14.2 Z"
                  fill="#fff" stroke="rgba(16,24,40,.55)" stroke-width="1.2" stroke-linejoin="round"/>
          </svg>
        </div>
      </div>
    </div>
  </div>

  <div id="cover">
    <div class="card">
      <h1>__TITLE__</h1>
      <p id="coverSub"></p>
      <button id="startBtn">Start demo</button>
      <div class="hint">Use ← → or click the highlighted spot</div>
    </div>
  </div>
</div>

<footer>
  <span class="dots" id="dots"></span>
  <span class="grow"></span>
  <span id="url"></span>
</footer>

<div id="callout" class="hidden"><div id="arrow"></div></div>

<script>__FLOATING_UI__</script>
<script>__RRWEB_SNAPSHOT__</script>
<script>
// Steps travel gzipped+base64 so a multi-MB capture ships as a file people can
// email. Inflated once here; identical to the uncompressed build, byte for byte.
const STEPS_B64 = "__STEPS_B64__";
let STEPS = [];
let idx = 0;
let scale = 1;

const $ = (id) => document.getElementById(id);
const mount = $('mount'), overlay = $('overlay'), scaler = $('scaler'),
      fit = $('fit'), stage = $('stage'), win = $('window'),
      cursor = $('cursor'), ripple = $('cursorRipple'), callout = $('callout'),
      arrowEl = $('arrow'), cover = $('cover');

async function loadSteps() {
  const bin = atob(STEPS_B64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  if (typeof DecompressionStream === 'undefined') {
    document.body.innerHTML =
      '<p style="padding:32px;font:15px system-ui">This demo needs a current '
      + 'browser (Chrome 80+, Safari 16.4+, Firefox 113+).</p>';
    throw new Error('DecompressionStream unavailable');
  }
  const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
  STEPS = JSON.parse(await new Response(stream).text());
}

function layout(step) {
  const { width, height } = step.viewport;
  const chromeH = 38;
  scale = Math.min(
    (stage.clientWidth - 40) / width,
    (stage.clientHeight - 40 - chromeH) / height,
    1,
  );
  scaler.style.width = width + 'px';
  scaler.style.height = height + 'px';
  scaler.style.transform = 'scale(' + scale + ')';
  fit.style.width = Math.round(width * scale) + 'px';
  fit.style.height = Math.round(height * scale) + 'px';
}

function render() {
  const step = STEPS[idx];
  layout(step);

  const previous = Array.from(mount.children);
  const { iframe } = rrwebSnapshot.rebuildIntoSandboxedIframe(step.snapshot, {
    root: mount,
    iframeAttributes: {
      style: 'width:' + step.viewport.width + 'px;height:' + step.viewport.height
           + 'px;border:0;display:block;background:#fff;opacity:0',
    },
    cache: rrwebSnapshot.createCache(),
    mirror: rrwebSnapshot.createMirror(),
  });
  requestAnimationFrame(() => {
    try {
      const doc = iframe.contentDocument;
      if (doc) {
        // rrweb rewrites <script> to <noscript>, and this iframe deliberately
        // has no allow-scripts — so the browser renders that noscript content,
        // printing "SCRIPT_PLACEHOLDER" into the page. Hide it.
        const fix = doc.createElement('style');
        fix.textContent = 'noscript{display:none!important}';
        (doc.head || doc.documentElement).appendChild(fix);
        doc.documentElement.scrollTop = step.scroll.y;
        doc.documentElement.scrollLeft = step.scroll.x;
        if (doc.body) doc.body.scrollTop = step.scroll.y;
      }
    } catch (e) { /* a missed scroll restore is not worth failing the step */ }
    iframe.style.opacity = '1';
    setTimeout(() => previous.forEach((el) => el.remove()), 340);
  });

  overlay.innerHTML = '';
  const h = step.hotspot;
  if (h) {
    const dot = document.createElement('div');
    dot.className = 'hotspot';
    dot.style.left = (h.x + h.width / 2) + 'px';
    dot.style.top = (h.y + h.height / 2) + 'px';
    dot.onclick = () => go(idx + 1);
    overlay.appendChild(dot);
  }
  moveCursor(h);
  placeCallout(step, h);

  $('cur').textContent = idx + 1;
  $('total').textContent = STEPS.length;
  $('caption').textContent = step.caption || '';
  $('url').textContent = step.url || '';
  $('addr').textContent = step.url || '';
  renderDots();
  if (location.hash !== '#step=' + (idx + 1)) {
    history.replaceState(null, '', '#step=' + (idx + 1));
  }
}

/**
 * Glide the pointer to the hotspot and tap on arrival. The element persists
 * across renders, so a new transform animates from wherever it was — that
 * travel is what makes the demo read as someone using the product.
 */
let tapTimer = null;
function moveCursor(h) {
  clearTimeout(tapTimer);
  if (!h) { cursor.style.opacity = '0'; return; }
  const cx = h.x + h.width / 2, cy = h.y + h.height / 2;
  if (cursor.dataset.placed !== '1') {
    cursor.style.transition = 'none';
    cursor.style.transform = 'translate(' + (cx - 90) + 'px,' + (cy + 60) + 'px)';
    cursor.offsetHeight;
    cursor.style.transition = '';
    cursor.dataset.placed = '1';
  }
  cursor.style.opacity = '1';
  cursor.style.transform = 'translate(' + cx + 'px,' + cy + 'px)';
  ripple.style.transform = 'translate(' + cx + 'px,' + cy + 'px)';
  tapTimer = setTimeout(() => {
    ripple.classList.remove('go'); ripple.offsetHeight; ripple.classList.add('go');
  }, 740);
}

/**
 * Anchor the callout with floating-ui rather than hand-rolled arithmetic: it
 * handles flip, shift and viewport collision, which a bespoke version gets
 * wrong the first time the hotspot sits near an edge.
 *
 * The hotspot lives inside a scaled frame, so we hand floating-ui a virtual
 * reference whose rect is already converted to screen coordinates.
 */
function placeCallout(step, h) {
  callout.innerHTML = '<div id="arrow"></div>';
  const text = document.createElement('div');
  text.className = 'text';
  text.textContent = step.caption || '';
  const foot = document.createElement('div');
  foot.className = 'foot';
  const of = document.createElement('span');
  of.className = 'of';
  of.textContent = (idx + 1) + ' of ' + STEPS.length;
  const grow = document.createElement('span');
  grow.className = 'grow';
  const back = document.createElement('button');
  back.className = 'back'; back.innerHTML = '&#8592;'; back.disabled = idx === 0;
  back.onclick = (e) => { e.stopPropagation(); go(idx - 1); };
  const next = document.createElement('button');
  next.innerHTML = '&#8594;'; next.disabled = idx === STEPS.length - 1;
  next.onclick = (e) => { e.stopPropagation(); go(idx + 1); };
  foot.append(of, grow, back, next);
  callout.append(text, foot);
  callout.classList.remove('hidden');

  const arrow = callout.querySelector('#arrow');
  const fitBox = fit.getBoundingClientRect();
  const reference = h
    ? {
        getBoundingClientRect: () => ({
          x: fitBox.left + h.x * scale, y: fitBox.top + h.y * scale,
          left: fitBox.left + h.x * scale, top: fitBox.top + h.y * scale,
          width: h.width * scale, height: h.height * scale,
          right: fitBox.left + (h.x + h.width) * scale,
          bottom: fitBox.top + (h.y + h.height) * scale,
        }),
      }
    // No hotspot: this beat is "look at the result", so park the card in the
    // frame's bottom-left instead of pointing at nothing.
    : {
        getBoundingClientRect: () => ({
          x: fitBox.left + 24, y: fitBox.bottom - 24,
          left: fitBox.left + 24, top: fitBox.bottom - 24,
          width: 1, height: 1,
          right: fitBox.left + 25, bottom: fitBox.bottom - 23,
        }),
      };

  FloatingUIDOM.computePosition(reference, callout, {
    placement: h ? 'bottom-start' : 'top-start',
    middleware: [
      FloatingUIDOM.offset(14),
      FloatingUIDOM.flip({ padding: 12 }),
      FloatingUIDOM.shift({ padding: 12 }),
      FloatingUIDOM.arrow({ element: arrow, padding: 12 }),
    ],
  }).then(({ x, y, placement, middlewareData }) => {
    Object.assign(callout.style, { left: x + 'px', top: y + 'px' });
    const side = placement.split('-')[0];
    const opposite = { top: 'bottom', bottom: 'top', left: 'right', right: 'left' }[side];
    const a = middlewareData.arrow || {};
    Object.assign(arrow.style, {
      left: a.x != null ? a.x + 'px' : '',
      top: a.y != null ? a.y + 'px' : '',
      [opposite]: '-5px',
      display: h ? 'block' : 'none',
    });
  });
}

function renderDots() {
  const wrap = $('dots');
  wrap.innerHTML = '';
  STEPS.forEach((s, i) => {
    const d = document.createElement('span');
    d.className = 'dot' + (i === idx ? ' on' : '');
    d.title = (i + 1) + '. ' + (s.caption || '');
    d.onclick = () => go(i);
    wrap.appendChild(d);
  });
}

function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  idx = i;
  render();
}

$('fs').onclick = () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
};
$('startBtn').onclick = () => { cover.classList.add('gone'); };
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); cover.classList.add('gone'); go(idx + 1); }
  if (e.key === 'ArrowLeft') { e.preventDefault(); go(idx - 1); }
});
window.addEventListener('resize', () => { if (STEPS.length) render(); });

loadSteps().then(() => {
  $('coverSub').textContent = STEPS.length + ' steps · '
    + (STEPS[0] && STEPS[0].url ? new URL(STEPS[0].url).host : '');
  const fromHash = parseInt((location.hash.match(/step=(\d+)/) || [])[1], 10);
  if (fromHash >= 1 && fromHash <= STEPS.length) {
    idx = fromHash - 1;
    cover.classList.add('gone'); // a deep link means they were sent to a step
  }
  render();
});
</script>
</body>
</html>
